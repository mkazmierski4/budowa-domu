<title>Od działki do klucza</title>
<meta name="description" content="Darmowy, interaktywny poradnik budowy domu od działki do klucza.">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-house" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7M5.5 9.5V20h13V9.5M10 20v-5.5h4V20"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 21.5 20h-19zM12 10v4.5M12 17.3v.2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 7 21h10a1.5 1.5 0 0 0 1.5-1.5V7.5zM14 3v4.5h4.5M9 12.5h6M9 16h6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8M16 5.5a3 3 0 0 1 0 6M17.5 14.5c1.6.6 2.7 2.2 3 4.5"/></symbol>
  <symbol id="i-rebar" viewBox="0 0 24 24"><path d="M7 4v16M12 4v16M17 4v16M4 8.5h16M4 15.5h16"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h12A1.5 1.5 0 0 1 19 7.5V9M4 7.5v10A1.5 1.5 0 0 0 5.5 19h13a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 18.5 9h-13A1.5 1.5 0 0 1 4 7.5zM16 14h.5"/></symbol>

  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3.5" y="4" width="7" height="16" rx="1.5"/><rect x="13.5" y="4" width="7" height="16" rx="1.5"/></symbol>
  <symbol id="i-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 16.6v.2"/></symbol>
  <symbol id="i-listcheck" viewBox="0 0 24 24"><path d="M11 6h9M11 12h9M11 18h9M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></symbol>
  <symbol id="i-stamp" viewBox="0 0 24 24"><path d="M9.5 3.5h5l-1 6.5h-3zM5 13.5c0-1.9 1.6-3.5 3.5-3.5h7c1.9 0 3.5 1.6 3.5 3.5V16H5zM4 20h16"/></symbol>

<div class="app" id="app" data-view="krok">
  <header class="top">
    <div class="top-row">
      <button class="iconbtn menu-btn" id="menuBtn" aria-label="Pokaż etapy budowy" aria-expanded="false"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="brand"><span class="brand-mark"><svg class="ico"><use href="#i-house"/></svg></span><span class="brand-t">Od działki do klucza</span></div>
      <div class="money" aria-live="polite">
        <div class="total"><span>Budżet</span><b class="num">2 300 000 zł</b></div>
        <div class="spent"><span>Wydano i zaplanowano</span><b class="num" id="mSpent">0 zł</b><small class="num" id="mRange"></small></div>
        <div class="left"><span>Zostaje</span><b class="num" id="mLeft">0 zł</b><small class="num" id="mRes"></small><em class="delta num" id="delta"></em></div>
      </div>
      <button class="iconbtn" id="themeBtn" aria-label="Przełącz motyw"><svg class="ico"><use id="themeIco" href="#i-moon"/></svg></button>
    </div>
    <div class="bar" id="bar" role="img" aria-label="Podział budżetu na kategorie"></div>
  </header>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Etapy budowy"></nav>

    <main class="main" id="main">
      <div class="scroll" id="scroll"><div class="stepwrap" id="stepwrap"></div></div>
      <div class="foot">
        <button class="nav prev" id="prev"><svg class="ico"><use href="#i-left"/></svg><span id="prevT">Wstecz</span></button>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="keys" aria-hidden="true"><kbd><svg class="ico"><use href="#i-left"/></svg></kbd><kbd><svg class="ico"><use href="#i-right"/></svg></kbd></div>
        <button class="nav next" id="next"><span id="nextT">Dalej</span><svg class="ico"><use href="#i-right"/></svg></button>
      </div>
    </main>

    <aside class="vizpane" id="vizpane" aria-label="Wizualizacja domu"><div class="vizpane-in" id="vizpaneIn">
      <div class="viz-h">
        <div><h2>Twój dom</h2><p>Dom referencyjny, ok. 190 m², poddasze, garaż w bryle</p></div>
        <div class="pct"><b class="num" id="pct">0%</b><span>postęp budowy</span></div>
      </div>
      <div class="hp"><i id="hp"></i></div>
      <div id="viz"></div>
    </div></aside>
  </div>

  <nav class="tabbar" role="tablist" aria-label="Widok">
    <button role="tab" aria-selected="true" data-view="krok"><svg class="ico"><use href="#i-book"/></svg>Krok</button>
    <button role="tab" aria-selected="false" data-view="dom"><svg class="ico"><use href="#i-house"/></svg>Dom</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status"><svg class="ico"><use href="#i-stamp"/></svg><span id="toastT"></span></div>
