<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Od działki do klucza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Aplikacja w trzech strefach: pasek budżetu u góry, etapy po lewej, krok w środku (porcjami), dom po prawej. */
:root{
  color-scheme:light;
  --bg:#ece6dc; --pane:#faf7f2; --pane-2:#f2ece3; --raise:#ffffff;
  --ink:#26231f; --ink-2:#575148; --ink-3:#766f64;
  --line:#e4dccf; --line-2:#d2c8b8;
  --wood:#8d5d31; --wood-soft:#f1e3d1; --lamp:#df9f3f; --lamp-soft:#f9e7c7;
  --moss:#4b6a44; --moss-soft:#e0e9da; --rust:#ad442e; --rust-soft:#f7e0d8;
  --spent:#3b3733; --on-ink:#faf7f2;
  --shadow:0 1px 2px rgba(70,50,30,.06),0 10px 28px -14px rgba(70,50,30,.22);
  --shadow-hi:0 2px 4px rgba(70,50,30,.08),0 18px 36px -16px rgba(70,50,30,.32);
  --draw:#7a6a55; --stars-op:0;
  --sky1:#CBD6DA; --sky2:#EFE6D6; --ground:#B9A585; --ground-dark:#8C7556; --lawn:#8FA06A; --lawn-dark:#6E8250;
  --raw:#C38A63; --raw-line:#A06E4D; --concrete:#B4B1AA; --concrete-top:#CFCCC5;
  --plaster:#F2EEE6; --plaster-side:#DCD5C8; --stone:#9C9387; --stone-line:#7D756B;
  --cladding:#A9743F; --cladding-line:#80552C; --roof:#3A3D42; --roof-line:#2C2E32;
  --glass:#6F8792; --frame:#2E3033; --lit:#F6C46E; --lit-op:.45; --glow-op:0; --water:#7FB3C4; --scaff:#7C7F84; --amber:#F0A93C;
  --f:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#141312; --pane:#1c1b19; --pane-2:#24221f; --raise:#2a2825;
  --ink:#efe8dd; --ink-2:#bab2a6; --ink-3:#958d81;
  --line:#2e2b27; --line-2:#403b35;
  --wood:#d6a16b; --wood-soft:#3a2c1f; --lamp:#f3b75d; --lamp-soft:#3b2f1e;
  --moss:#98b98a; --moss-soft:#223025; --rust:#ee9076; --rust-soft:#3c2520;
  --spent:#d9d0c2; --on-ink:#1c1b19;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -16px rgba(0,0,0,.7);
  --shadow-hi:0 1px 0 rgba(255,255,255,.05) inset,0 20px 40px -18px rgba(0,0,0,.8);
  --draw:#f3b75d; --stars-op:1;
  --sky1:#0F1726; --sky2:#3A3B4A; --ground:#3B3428; --ground-dark:#2A251D; --lawn:#33402C; --lawn-dark:#26301F;
  --raw:#7A5844; --raw-line:#5E4333; --concrete:#5E5D5A; --concrete-top:#6C6B67;
  --plaster:#B9B2A6; --plaster-side:#8F897F; --stone:#6C665E; --stone-line:#4F4A44;
  --cladding:#7A5330; --cladding-line:#5A3C22; --roof:#25272B; --roof-line:#1A1B1E;
  --glass:#2C3940; --frame:#151618; --lit:#FFC56A; --lit-op:.95; --glow-op:.55; --water:#3E8FA6; --scaff:#8A8D92; --amber:#F4B860;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141312; --pane:#1c1b19; --pane-2:#24221f; --raise:#2a2825;
  --ink:#efe8dd; --ink-2:#bab2a6; --ink-3:#958d81;
  --line:#2e2b27; --line-2:#403b35;
  --wood:#d6a16b; --wood-soft:#3a2c1f; --lamp:#f3b75d; --lamp-soft:#3b2f1e;
  --moss:#98b98a; --moss-soft:#223025; --rust:#ee9076; --rust-soft:#3c2520;
  --spent:#d9d0c2; --on-ink:#1c1b19;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -16px rgba(0,0,0,.7);
  --shadow-hi:0 1px 0 rgba(255,255,255,.05) inset,0 20px 40px -18px rgba(0,0,0,.8);
  --draw:#f3b75d; --stars-op:1;
  --sky1:#0F1726; --sky2:#3A3B4A; --ground:#3B3428; --ground-dark:#2A251D; --lawn:#33402C; --lawn-dark:#26301F;
  --raw:#7A5844; --raw-line:#5E4333; --concrete:#5E5D5A; --concrete-top:#6C6B67;
  --plaster:#B9B2A6; --plaster-side:#8F897F; --stone:#6C665E; --stone-line:#4F4A44;
  --cladding:#7A5330; --cladding-line:#5A3C22; --roof:#25272B; --roof-line:#1A1B1E;
  --glass:#2C3940; --frame:#151618; --lit:#FFC56A; --lit-op:.95; --glow-op:.55; --water:#3E8FA6; --scaff:#8A8D92; --amber:#F4B860;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wood);outline-offset:2px;border-radius:6px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- szkielet aplikacji ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.top-row,.money{min-width:0}
.top{background:var(--pane);border-bottom:1px solid var(--line);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:12px 10px;position:relative;z-index:3}
.top-row{display:flex;align-items:center;gap:16px 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--on-ink)}
.brand-mark .ico{width:19px;height:19px}
.money{display:flex;align-items:baseline;gap:6px 28px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.money div{display:flex;flex-direction:column;align-items:flex-end;position:relative}
.money span{font-size:12px;color:var(--ink-3)}
.money b{font-weight:600;font-size:17px;letter-spacing:-.01em}
.money .left b{font-size:22px}
.delta{position:absolute;right:calc(100% + 12px);bottom:1px;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--lamp-soft);color:var(--wood);white-space:nowrap;opacity:0;pointer-events:none}
.delta.minus{background:var(--moss-soft);color:var(--moss)}
.iconbtn{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--pane);transition:background-color .15s,transform .2s var(--spring)}
.iconbtn:hover{background:var(--pane-2)}
.iconbtn:active{transform:scale(.94)}
.menu-btn{display:none}
.bar{display:flex;gap:3px;margin-top:12px}
.seg{flex-basis:0;min-width:0}
.trk{position:relative;display:block;height:8px;border-radius:3px;background:var(--pane-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.seg:first-child .trk{border-radius:5px 3px 3px 5px}
.seg:last-child .trk{border-radius:3px 5px 5px 3px}
.trk i{position:absolute;top:0;bottom:0;left:0;width:0;transition:width .6s var(--spring),left .6s var(--spring)}
.trk .f{background:var(--spent)}
.trk .c{background:var(--lamp)}
.seg.flash .trk{animation:flash .9s var(--out)}
@keyframes flash{0%{box-shadow:inset 0 0 0 1px var(--line),0 0 0 0 var(--lamp)}30%{box-shadow:inset 0 0 0 1px var(--lamp),0 0 0 4px var(--lamp-soft)}100%{box-shadow:inset 0 0 0 1px var(--line),0 0 0 0 transparent}}
.seg-l{display:flex;flex-direction:column;gap:0;margin-top:6px;padding-right:8px;font-size:12px;line-height:1.35;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.seg-l b{font-weight:500;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.seg-l span{overflow:hidden;text-overflow:ellipsis}

.body{display:grid;grid-template-columns:286px minmax(0,1fr) minmax(360px,32vw);min-height:0}

/* ---------- etapy ---------- */
.rail{background:var(--pane);border-right:1px solid var(--line);overflow:auto;padding:20px 12px 24px;min-height:0}
.rail-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 10px 12px}
.rail-h h2{margin:0;font-size:15px;font-weight:600}
.rail-h span{font-size:13px;color:var(--ink-3)}
.stages,.steps{list-style:none;margin:0;padding:0}
.stg{display:grid;grid-template-columns:24px 26px minmax(0,1fr);align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;font-size:15px;transition:background-color .15s}
.stg:hover{background:var(--pane-2)}
.stg .nr{font-size:12px;color:var(--ink-3)}
.stg.done .t{color:var(--ink-2)}
.stg.cur{background:var(--pane-2);font-weight:600}
.stat{width:22px;height:22px;display:block}
.stat circle{fill:none;stroke:var(--line-2);stroke-width:1.6}
.stat .ring{stroke:var(--wood);stroke-width:2.2;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .6s var(--out)}
.stat .dot{fill:var(--moss);stroke:none}
.stat .ck{fill:none;stroke:var(--pane);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.steps{margin:4px 0 8px 34px;border-left:1px solid var(--line);padding-left:8px}
.stp{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:9px;font-size:14px;color:var(--ink-2);transition:background-color .15s,color .15s}
.stp:hover{background:var(--pane-2);color:var(--ink)}
.stp[aria-current="step"]{background:var(--wood-soft);color:var(--ink);font-weight:600}
.mini{width:16px;height:16px;display:block}
.mini circle{fill:none;stroke:var(--line-2);stroke-width:1.6}
.mini .on{fill:var(--wood);stroke:none}
.mini .dn{fill:var(--moss);stroke:none}
.mini path{fill:none;stroke:var(--pane);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:0}
.mini.pop path{animation:drawck .45s .1s var(--out) backwards}
.mini.pop .dn{animation:pop .45s var(--spring) backwards}
@keyframes drawck{from{stroke-dashoffset:14}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.mini .dn,.stat .dot{transform-origin:center;transform-box:fill-box}

/* ---------- krok ---------- */
.main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--pane)}
.scroll{flex:1;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.stepwrap{max-width:780px;margin:0 auto;padding-block:36px 40px;padding-inline:clamp(20px,4vw,56px)}
.sh{position:relative}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:14px;color:var(--ink-3)}
.meta b{font-weight:500;color:var(--wood)}
.sbar{display:flex;gap:4px;margin:12px 0 20px;max-width:360px}
.sbar i{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.sbar i::after{content:"";position:absolute;inset:0;background:var(--moss);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--out)}
.sbar i.dn::after{transform:none}
.sbar i.on{background:var(--wood-soft);box-shadow:inset 0 0 0 1px var(--wood)}
h1{margin:0;font-size:clamp(32px,3.6vw,46px);line-height:1.06;font-weight:650;letter-spacing:-.028em;text-wrap:balance;padding-right:130px}
.stamp{position:absolute;right:0;top:34px;display:grid;place-items:center;gap:0;padding:8px 14px 7px;border:2.5px solid var(--moss);border-radius:8px;color:var(--moss);transform:rotate(-9deg);text-align:center;line-height:1.1;opacity:0;pointer-events:none}
.stamp::before{content:"";position:absolute;inset:3px;border:1px solid var(--moss);border-radius:5px;opacity:.6}
.stamp b{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.stamp span{font-size:11px;letter-spacing:.04em}
.stamp.on{opacity:.92}
.stamp.hit{animation:stamp .5s var(--spring)}
@keyframes stamp{0%{opacity:0;transform:rotate(-20deg) scale(1.9)}55%{opacity:1}100%{opacity:.92;transform:rotate(-9deg) scale(1)}}

.ptabs{position:relative;display:flex;gap:4px;margin:26px 0 0;padding:4px;border-radius:14px;background:var(--pane-2);width:max-content;max-width:100%;overflow-x:auto}
.ptab{position:relative;z-index:1;display:flex;align-items:center;gap:7px;border:0;background:none;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:color .2s}
.ptab .ico{width:17px;height:17px}
.ptab:hover{color:var(--ink)}
.ptab[aria-selected="true"]{color:var(--ink)}
.ptab .okdot{width:6px;height:6px;border-radius:50%;background:var(--moss)}
.pind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:10px;background:var(--raise);box-shadow:var(--shadow);transition:transform .42s var(--spring),width .42s var(--spring)}

.panel{margin-top:28px}
.lead{margin:0;font-size:clamp(19px,1.7vw,22px);line-height:1.5;color:var(--ink);max-width:40em;letter-spacing:-.005em}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;list-style:none;margin:22px 0 0;padding:0}
.facts li{display:flex;align-items:center;gap:9px;font-size:15px}
.facts .ico{color:var(--wood)}
.facts span{color:var(--ink-3);margin-right:2px}
.prose{margin-top:24px;font-size:17.5px;line-height:1.68;color:var(--ink-2);max-width:62ch}
.prose p{margin:0 0 .9em}
.prose strong{color:var(--ink);font-weight:600}

.acc{margin-top:28px;border-top:1px solid var(--line)}
.acc-i{border-bottom:1px solid var(--line)}
.acc-b{display:grid;grid-template-columns:38px minmax(0,1fr) auto 22px;align-items:center;gap:10px;width:100%;border:0;background:none;padding:14px 4px;text-align:left;font-size:17px;font-weight:600;border-radius:10px;transition:background-color .15s}
.acc-b:hover{background:var(--pane-2)}
.acc-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--wood-soft);color:var(--wood)}
.acc-i.warn .acc-ic{background:var(--rust-soft);color:var(--rust)}
.acc-i.formal .acc-ic{background:var(--moss-soft);color:var(--moss)}
.acc-n{font-size:13px;font-weight:500;color:var(--ink-3)}
.acc-b .chev{transition:transform .35s var(--spring);color:var(--ink-3)}
.acc-b[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--out)}
.acc-p>div{overflow:hidden}
.acc-b[aria-expanded="true"]+.acc-p{grid-template-rows:1fr}
.acc-p ul{list-style:none;margin:0;padding:2px 4px 18px 52px;display:grid;gap:12px;font-size:16.5px;line-height:1.6;color:var(--ink-2);max-width:64ch}
.acc-p li{position:relative}
.acc-p li::before{content:"";position:absolute;left:-18px;top:.68em;width:6px;height:6px;border-radius:50%;background:var(--wood-2,var(--wood));opacity:.7}
.acc-i.warn li::before{background:var(--rust)}
.acc-i.formal li::before{background:var(--moss)}
.fm{display:block;font-size:14px;color:var(--ink-3);margin-top:2px}

/* wybór */
.intro{margin:0 0 20px;font-size:17px;line-height:1.6;color:var(--ink-2);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;border-radius:16px;background:var(--raise);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);cursor:pointer;transition:transform .3s var(--spring),box-shadow .25s var(--out)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi),inset 0 0 0 1px var(--line-2)}
.card:active{transform:translateY(-1px) scale(.99)}
.card input{position:absolute;opacity:0;pointer-events:none}
.card:has(input:focus-visible){outline:2px solid var(--wood);outline-offset:3px}
.card.on{box-shadow:var(--shadow-hi),inset 0 0 0 2px var(--wood);transform:translateY(-3px)}
.card-top{display:flex;align-items:center;gap:8px;min-height:28px}
.card-k{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pane-2);font-size:13px;font-weight:600;color:var(--ink-2);transition:background-color .25s,color .25s}
.card.on .card-k{background:var(--wood);color:var(--on-ink)}
.rec{font-size:12px;font-weight:600;color:var(--moss);background:var(--moss-soft);padding:3px 9px;border-radius:999px}
.tick{position:absolute;top:14px;right:14px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--wood);color:var(--on-ink);transform:scale(0);transition:transform .4s var(--spring)}
.tick .ico{width:15px;height:15px;stroke-width:2.4}
.card.on .tick{transform:scale(1)}
.card-n{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.005em;min-height:2.6em}
.card-c{font-size:22px;font-weight:600;letter-spacing:-.02em}
.card-c small{font-size:14px;font-weight:500;color:var(--ink-3)}
.card-m{display:grid;gap:6px;font-size:14px;color:var(--ink-2);padding-top:10px;border-top:1px solid var(--line)}
.card-m span{display:flex;gap:8px;align-items:flex-start}
.card-m .ico{width:16px;height:16px;color:var(--ink-3);margin-top:2px}
.detail{margin-top:24px}
.pc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 32px}
.pc h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--ink-3)}
.pc ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:16px}
.pc li{display:flex;gap:10px;align-items:flex-start}
.pc .ico{width:18px;height:18px;margin-top:3px;stroke-width:2}
.pc .pro .ico{color:var(--moss)}
.pc .con .ico{color:var(--rust)}
.why{margin:20px 0 0;padding:16px 18px;border-radius:14px;background:var(--pane-2);font-size:16px;line-height:1.6;color:var(--ink-2);max-width:66ch}
.why b{color:var(--ink);font-weight:600}

/* pytanie */
.q{margin:0 0 20px;font-size:clamp(21px,2vw,25px);line-height:1.35;font-weight:600;letter-spacing:-.015em;max-width:30em}
.answers{display:grid;gap:10px;max-width:620px}
.ans{display:grid;grid-template-columns:32px minmax(0,1fr) 26px;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:0;background:var(--raise);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);font-size:17px;transition:transform .25s var(--spring),box-shadow .2s,background-color .2s,opacity .2s}
.ans:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-hi),inset 0 0 0 1px var(--line-2)}
.ans:active:not(:disabled){transform:scale(.985)}
.ans:disabled{cursor:default}
.ans-k{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pane-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.ans-r{width:26px;height:26px}
.ans-r path{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ans.ok{background:var(--moss-soft);box-shadow:inset 0 0 0 2px var(--moss)}
.ans.ok .ans-k{background:var(--moss);color:var(--pane)}
.ans.ok .ans-r path{stroke:var(--moss);stroke-dasharray:24;animation:drawq .5s .05s var(--out) backwards}
@keyframes drawq{from{stroke-dashoffset:24}}
.ans.bad{background:var(--rust-soft);box-shadow:inset 0 0 0 1px var(--rust);color:var(--ink-2)}
.ans.bad .ans-k{background:var(--rust);color:var(--pane)}
.ans.bad .ans-r path{stroke:var(--rust)}
.ans.dim{opacity:.5}
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.qfb{margin-top:18px;max-width:62ch;font-size:16.5px;line-height:1.6;color:var(--ink-2)}
.qfb b{color:var(--ink)}
.qfb.try{color:var(--rust)}

/* odbiór */
.prog{display:flex;align-items:center;gap:14px;margin-bottom:18px;max-width:560px}
.prog-t{flex:1;height:8px;border-radius:4px;background:var(--pane-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.prog-t i{display:block;height:100%;width:0;background:var(--moss);border-radius:4px;transition:width .5s var(--spring)}
.prog b{font-size:14px;font-weight:600;color:var(--ink-2);min-width:3.5em;text-align:right}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-width:640px}
.chk{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;align-items:center;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:16.5px;line-height:1.45;transition:background-color .15s,color .2s}
.chk:hover{background:var(--pane-2)}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk:has(input:focus-visible){outline:2px solid var(--wood);outline-offset:1px}
.box{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1.8px var(--line-2);transition:background-color .2s,box-shadow .2s,transform .3s var(--spring)}
.box svg{width:16px;height:16px}
.box path{fill:none;stroke:var(--pane);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s var(--out)}
.chk input:checked+.box{background:var(--moss);box-shadow:none;transform:scale(1.06)}
.chk input:checked+.box path{stroke-dashoffset:0}
.chk input:checked~.ct{color:var(--ink-3)}
.chk input:disabled~*{cursor:default}
.done-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-size:15px;font-weight:600;background:var(--ink);color:var(--on-ink);transition:transform .25s var(--spring),opacity .2s,background-color .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{color:var(--ink)}
.link{border:0;background:none;padding:8px 2px;font-size:14px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.hint{font-size:14px;color:var(--ink-3)}

/* stopka kroku */
.foot{display:flex;align-items:center;gap:12px;padding-block:12px;padding-inline:clamp(16px,3vw,32px);border-top:1px solid var(--line);background:var(--pane)}
.nav{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:10px 14px;border-radius:12px;min-height:46px;font-size:15px;font-weight:500;color:var(--ink-2);transition:background-color .15s,transform .2s var(--spring);max-width:42%;min-width:0}
.nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:hover:not(:disabled){background:var(--pane-2);color:var(--ink)}
.nav:active:not(:disabled){transform:scale(.97)}
.nav:disabled{opacity:.35;cursor:default}
.nav.next{margin-left:auto;background:var(--ink);color:var(--on-ink);font-weight:600}
.nav.next:hover:not(:disabled){background:var(--ink);color:var(--on-ink);transform:translateX(2px)}
.dots{display:flex;gap:6px;margin-inline:auto}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line-2);transition:width .35s var(--spring),background-color .2s}
.dots i.on{width:22px;background:var(--wood)}
.keys{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.keys kbd{display:grid;place-items:center;width:24px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line-2),0 1px 0 var(--line-2);font:inherit}
.keys .ico{width:13px;height:13px}

/* ---------- wizualizacja ---------- */
.viz{background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:22px clamp(16px,2vw,28px) 24px;display:flex;flex-direction:column;gap:16px;min-height:0}
.viz-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.viz-h h2{margin:0;font-size:15px;font-weight:600}
.viz-h p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.pct{text-align:right}
.pct b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
.pct span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.hp{height:6px;border-radius:3px;background:var(--pane-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.hp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--wood),var(--lamp));border-radius:3px;transition:width .8s var(--spring)}
.frame{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
#house{display:block;width:100%;height:auto}
#house .hide{display:none}
#house .glow{fill:var(--lit);filter:url(#glow);opacity:var(--glow-op)}
#house .lit{fill:var(--lit);opacity:var(--lit-op)}
#house .stars{opacity:var(--stars-op)}
#house .svg-label{font:500 11px var(--f);fill:var(--ink-2)}
.stagechip{position:absolute;left:12px;top:12px;padding:5px 11px;border-radius:999px;background:var(--pane);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--ink)}
.scrub{display:grid;gap:8px}
.scrub-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.scrub label{font-size:13px;color:var(--ink-3)}
.scrub output{font-size:14px;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0;cursor:pointer;--p:25%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--wood) var(--p),var(--line-2) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--wood) var(--p),var(--line-2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--raise);box-shadow:0 1px 3px rgba(0,0,0,.25),inset 0 0 0 2px var(--wood);transition:transform .2s var(--spring)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--raise);box-shadow:0 1px 3px rgba(0,0,0,.25),inset 0 0 0 2px var(--wood)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.ticks{display:flex;justify-content:space-between;padding:0 8px;margin-top:-6px}
.ticks i{width:1px;height:5px;background:var(--line-2)}
.ticks i.dn{background:var(--wood)}
.cap{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2);min-height:3.1em}
.back{align-self:flex-start}

/* toast, szuflada, dolne zakładki */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--on-ink);font-size:15px;font-weight:500;box-shadow:var(--shadow-hi);opacity:0;pointer-events:none;z-index:20;transition:opacity .25s,transform .4s var(--spring);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ico{color:var(--lamp)}
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.tabbar{display:none}

@media (max-width:1180px){
  .body{grid-template-columns:minmax(0,1fr) minmax(320px,38vw)}
  .menu-btn{display:grid}
  .rail{position:fixed;z-index:9;top:0;bottom:0;left:0;width:min(320px,86vw);border-right:1px solid var(--line);box-shadow:var(--shadow-hi);transform:translateX(-102%);transition:transform .4s var(--out);padding-top:calc(20px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  body.drawer .rail{transform:none}
  body.drawer .scrim{opacity:1;pointer-events:auto}
}
@media (max-width:760px){
  .app{grid-template-rows:auto minmax(0,1fr) auto}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 10px}
  .top-row{gap:10px}
  .brand-t{display:none}
  .money{gap:4px 16px}
  .money .spent,.money .total{display:none}
  .money .left b{font-size:19px}
  .seg-l{display:none}
  .bar{margin-top:10px}
  .body{grid-template-columns:minmax(0,1fr)}
  .viz{display:none;border-left:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .app[data-view="dom"] .main{display:none}
  .app[data-view="dom"] .viz{display:flex}
  .stepwrap{padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px));padding-block:24px 28px}
  h1{padding-right:0}
  .stamp{top:-6px;right:0;padding:5px 10px 4px}
  .stamp b{font-size:12px}
  .ptabs{width:100%}
  .ptab{flex:1;justify-content:center;padding:9px 8px}
  .ptab .ico{display:none}
  .cards{grid-template-columns:minmax(0,1fr)}
  .card-n{min-height:0}
  .pc{grid-template-columns:minmax(0,1fr)}
  .keys{display:none}
  .foot{padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
  .nav{max-width:48%}
  .nav.prev span{display:none}
  .acc-p ul{padding-left:20px}
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--pane);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:9px 0 8px;font-size:12px;font-weight:500;color:var(--ink-3);min-height:54px}
  .tabbar button[aria-selected="true"]{color:var(--wood)}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

  function undo(i){
    var was = stageDone();
    st.done = st.done.filter(function(x){ return x!==i; }); save();
    checks[i] = checks[i].map(function(){ return false; });
    renderStep(); renderRail(); progress();
    if (was){ setViz(CUR_STAGE); range.value = CUR_STAGE; rangeUI(); }
  }

  /* ---------- wizualizacja ---------- */
  var house = $('#house'), groups = $$('#house [data-min]'), range = $('#range');
  $('#ticks').innerHTML = STAGES.map(function(){ return '<i></i>'; }).join('');
  function curVizStage(){ return CUR_STAGE + (stageDone()?1:0); }
  function drawIn(g, base){
    g.classList.remove('hide');
    if (reduce || !g.animate) return;
    anim(g, [{opacity:0, transform:'translateY(12px)'},{opacity:1, transform:'none'}], {duration:420, delay:base, easing:SPRING, fill:'backwards'});
    var n = 0;
    $$('rect,polygon,path,ellipse,circle', g).forEach(function(el){
      if (el.closest('.glow,.lit,.stars')) return;
      var len = 0; try { len = el.getTotalLength(); } catch(e){}
      if (!len || !isFinite(len)) return;
      if (el._css !== undefined){ el.getAnimations().forEach(function(a){ a.cancel(); }); el.style.cssText = el._css; }
      el._css = el.style.cssText;
      var cs = getComputedStyle(el), stroked = cs.stroke !== 'none', filled = cs.fill !== 'none' && el.tagName !== 'path';
      var delay = base + Math.min(n++, 26)*24;
      if (!stroked){ el.style.stroke = 'var(--draw)'; el.style.strokeWidth = '1.3'; }
      el.style.strokeDasharray = len; el.style.strokeDashoffset = len;
      var a = el.animate([{strokeDashoffset:len},{strokeDashoffset:0}], {duration:420, delay:delay, easing:OUT, fill:'forwards'});
      var b = filled ? el.animate([{fillOpacity:0},{fillOpacity:0, offset:.45},{fillOpacity:1}], {duration:620, delay:delay, easing:'ease-out', fill:'backwards'}) : null;
      var last = b || a;
      last.onfinish = function(){ a.cancel(); if (b) b.cancel(); el.style.cssText = el._css; delete el._css; };
    });
  }
  function setViz(n, first){
    var prevS = view.stage; view.stage = n;
    var base = 0;
    groups.forEach(function(g){
      var mn = +g.dataset.min, mx = g.dataset.max ? +g.dataset.max : 99, show = n>=mn && n<=mx;
      var was = prevS!==null && prevS>=mn && prevS<=mx;
      if (show && (!was || first)){ drawIn(g, base); base += first ? 120 : 90; }
      else if (!show && !g.classList.contains('hide')){
        var a = anim(g, [{opacity:1},{opacity:0}], {duration:200, easing:'ease-in'});
        if (a) a.onfinish = function(){ g.classList.add('hide'); }; else g.classList.add('hide');
      } else if (show) g.classList.remove('hide');
    });
    $('#vizChip').textContent = 'Etap '+pad(n)+' '+STAGES[n][0];
    var cap = $('#cap'); cap.textContent = STAGES[n][1]; anim(cap, [{opacity:0, transform:'translateY(4px)'},{opacity:1, transform:'none'}], {duration:300, easing:OUT});
    $('#backBtn').hidden = n === curVizStage();
  }
  function rangeUI(){
    var v = +range.value, cs = curVizStage();
    range.style.setProperty('--p', (v/16*100)+'%');
    $('#rangeOut').textContent = pad(v)+' '+STAGES[v][0];
    $$('#ticks i').forEach(function(t, i){ t.classList.toggle('dn', i<=cs); });
  }
  range.addEventListener('input', function(){ setViz(+range.value); rangeUI(); });
  $('#backBtn').onclick = function(){ var c = curVizStage(); range.value = c; rangeUI(); setViz(c); };
  function progress(){
    var p = (CUR_STAGE + st.done.length/S.length) / 17;
    $('#hp').style.width = (p*100)+'%';
    var el = $('#pct'), to = Math.round(p*100), from = el._v||0; el._v = to;
    if (reduce){ el.textContent = to+'%'; return; }
    var t0 = performance.now();
    (function f(t){ var q = Math.min(1,(t-t0)/700), e = 1-Math.pow(1-q,4); el.textContent = Math.round(from+(to-from)*e)+'%'; if (q<1) requestAnimationFrame(f); })(t0);
  }

  /* ---------- motyw, szuflada, widoki, toast ---------- */
  var root = document.documentElement;
  try { var th = localStorage.getItem('budowa-v2-theme'); if (th) root.dataset.theme = th; } catch(e){}
  function isDark(){ return root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function themeIco(){ $('#themeIco').setAttribute('href', isDark() ? '#i-sun' : '#i-moon'); $('#themeBtn').setAttribute('aria-label', isDark() ? 'Włącz jasny motyw' : 'Włącz ciemny motyw'); }
  $('#themeBtn').onclick = function(){ root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('budowa-v2-theme', root.dataset.theme); } catch(e){} themeIco(); };
  themeIco();
  function drawer(o){ document.body.classList.toggle('drawer', o); $('#menuBtn').setAttribute('aria-expanded', o); }
  $('#menuBtn').onclick = function(){ drawer(!document.body.classList.contains('drawer')); };
  $('#scrim').onclick = function(){ drawer(false); };
  function isPhone(){ return matchMedia('(max-width:760px)').matches; }
  var vizShown = false;
  function setView(v){
    $('#app').dataset.view = v;
    $$('.tabbar button').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.view===v); });
    if (v==='dom'){ if (!vizShown){ vizShown = true; setViz(view.stage, true); } else anim($('#viz'), [{opacity:0},{opacity:1}], {duration:250}); }
    else { anim($('#main'), [{opacity:0},{opacity:1}], {duration:250}); moveInd(); }
  }
  $$('.tabbar button').forEach(function(b){ b.onclick = function(){ setView(b.dataset.view); }; });
  var tt;
  function toast(m){ var t = $('#toast'); $('#toastT').textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 3200); }

  /* ---------- klawiatura i gest ---------- */
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape') drawer(false);
    if (e.target.matches && e.target.matches('input,textarea,select')) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key==='ArrowRight'){ e.preventDefault(); next(); }
    if (e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  });
  var sx = null, sy = 0;
  scroller.addEventListener('touchstart', function(e){ var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, {passive:true});
  scroller.addEventListener('touchend', function(e){
    if (sx===null) return; var t = e.changedTouches[0], dx = t.clientX-sx, dy = t.clientY-sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.6){ if (dx<0) next(); else prev(); }
  }, {passive:true});
  window.addEventListener('resize', moveInd);

  /* ---------- start ---------- */
  renderRail(); renderStep(); enter(wrap, 0); budget(); progress();
  var vs = curVizStage(); range.value = vs; rangeUI();
  if (isPhone()){ view.stage = vs; groups.forEach(function(g){ var mn=+g.dataset.min, mx=g.dataset.max?+g.dataset.max:99; g.classList.toggle('hide', vs<mn||vs>mx); }); setViz(vs); }
  else { vizShown = true; setViz(vs, true); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
})();
</script>
</body>
</html>
